name: Build Virion APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply custom launcher icon
        run: |
          test -f icon.png
          cp icon.png app/src/main/res/mipmap/ic_launcher.png
          cp icon.png app/src/main/res/mipmap/ic_launcher_round.png

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Virion-Book-Online-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
