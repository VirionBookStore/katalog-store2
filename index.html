<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gravion Book Online - Katalog & Pembelian</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], }, colors: { goge: { primary: '#1A6B52', dark: '#13503D', light: '#E8F5E9', bg: '#F8FAFC', navy: '#1E293B' } } } }
    }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { background-color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
    .app-container { max-width: 414px; margin: 0 auto; background-color: #F8FAFC; min-height: 100vh; position: relative; overflow-x: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.1); padding-bottom: 80px; }
    @media (min-width: 768px) {
      .app-container { max-width: 1536px !important; border-radius: 1.5rem; margin: 2rem auto; min-height: calc(100vh - 4rem); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); padding-bottom: 4rem; }
      .desktop-grid-catalog { display: grid !important; grid-template-columns: repeat(8, minmax(0, 1fr)) !important; gap: 0.75rem !important; }
      .desktop-header-fixed { max-width: 1536px !important; left: 50% !important; transform: translateX(-50%) !important; border-bottom-left-radius: 1.5rem; border-bottom-right-radius: 1.5rem; }
      .desktop-nav-fixed { max-width: 1536px !important; left: 50% !important; transform: translateX(-50%) !important; border-top-left-radius: 1.5rem; border-top-right-radius: 1.5rem; }
      .desktop-content-max { max-width: 1480px; margin: 0 auto; }
    }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .login-bg { background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?q=80&w=1000&auto=format&fit=crop') center/cover; }
    input[type="file"] { display: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-slate-800">
  <div class="app-container">

    <!-- Modal Scanner -->
    <div id="modal-scanner" class="fixed inset-0 bg-black/80 z-[115] hidden flex items-center justify-center p-4 backdrop-blur-sm">
       <div class="bg-white rounded-3xl w-full max-w-[360px] p-5 relative text-center shadow-2xl">
          <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
             <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-qrcode text-goge-primary mr-1"></i> Scan Barcode / QR Buku</h3>
             <button onclick="closeScannerModal()" class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 cursor-pointer"><i class="fa-solid fa-xmark text-xs"></i></button>
          </div>
          <div id="reader" class="w-full rounded-2xl overflow-hidden bg-slate-900 border border-slate-200 mb-4 min-h-[250px]"></div>
          <button onclick="closeScannerModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs cursor-pointer">Tutup Scanner</button>
       </div>
    </div>

    <!-- Custom Alert -->
    <div id="custom-alert" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-center justify-center p-5 backdrop-blur-sm transition-opacity">
       <div id="custom-alert-content" class="bg-white rounded-3xl w-full max-w-[320px] p-6 text-center transform transition-all scale-95 opacity-0 shadow-2xl">
          <div id="custom-alert-icon" class="mb-4 flex justify-center"></div>
          <h3 id="custom-alert-title" class="text-lg font-extrabold text-slate-800 mb-2">Pemberitahuan</h3>
          <p id="custom-alert-message" class="text-sm text-slate-500 mb-6 leading-relaxed">Pesan</p>
          <button onclick="closeCustomAlert()" class="w-full bg-goge-primary text-white font-bold py-3.5 rounded-xl text-sm cursor-pointer shadow-lg">MENGERTI</button>
       </div>
    </div>

    <!-- Floating WhatsApp -->
    <a href="#" onclick="tanyaAdmin()" class="fixed bottom-[90px] right-5 w-14 h-14 bg-green-500 text-white rounded-full flex items-center justify-center shadow-lg z-[95] hover:bg-green-600"><i class="fa-brands fa-whatsapp text-3xl"></i></a>

    <!-- Katalog -->
    <section id="content-catalog" class="fade-in block">
      <div class="fixed top-0 left-0 right-0 max-w-[414px] mx-auto z-30 bg-goge-primary rounded-b-2xl pt-4 pb-3 px-5 shadow-md space-y-2.5 desktop-header-fixed md:px-10">
        <div class="flex justify-between items-center text-white">
          <div class="flex items-center gap-2">
             <div id="header-logo-wrapper" class="w-7 h-7 flex items-center justify-center bg-white/20 rounded-lg overflow-hidden">
                <i id="header-logo-icon" class="fa-solid fa-book-open text-sm"></i>
                <img id="header-logo-img" src="" alt="Logo" class="w-full h-full object-contain hidden">
             </div>
             <span class="font-bold text-base tracking-wide">GRAVION</span>
          </div>
          <div id="top-auth-btn" onclick="switchTab('login')" class="flex items-center gap-2 text-xs bg-white/20 pl-2 pr-3 py-1 rounded-full cursor-pointer">
            <div class="w-6 h-6 rounded-full overflow-hidden bg-white/30 flex items-center justify-center shrink-0 border border-white/50" id="top-auth-avatar-box"><i class="fa-solid fa-user text-white text-[10px]" id="top-auth-icon"></i></div>
            <span class="font-bold truncate text-[11px]" id="top-auth-text">Masuk / Daftar</span>
          </div>
        </div>
        <div class="relative flex items-center gap-2">
           <div class="relative flex-1">
              <i class="fa-solid fa-search absolute left-4 top-3 text-slate-400 text-xs"></i>
              <input type="text" id="global-search" oninput="handleSearch()" placeholder="Cari Buku Pilihan..." class="w-full bg-white rounded-xl pl-9 pr-9 py-2 text-xs focus:outline-none shadow-sm text-slate-700 font-medium placeholder-slate-400">
              <button id="clear-search-btn" onclick="clearSearchInput()" class="absolute right-3 top-2.5 text-slate-400 hidden cursor-pointer text-xs"><i class="fa-solid fa-xmark"></i></button>
           </div>
           <button onclick="openScannerModal()" class="bg-white text-goge-primary px-3 py-2 rounded-xl text-xs font-bold shadow-sm hover:bg-goge-light flex items-center gap-1 shrink-0 cursor-pointer"><i class="fa-solid fa-camera text-sm"></i></button>
        </div>
      </div>

      <div class="pt-[110px] px-3 space-y-4 md:px-6 md:pt-[130px] desktop-content-max">
        <div class="bg-goge-primary/10 p-3 rounded-2xl border border-goge-primary/20">
          <p class="text-[10px] font-bold text-goge-primary mb-2 text-center uppercase tracking-wider">Pilih Cabang Toko</p>
          <div id="cabang-filter-container" class="flex overflow-x-auto gap-3 pb-2 snap-x hide-scrollbar justify-start md:justify-center"></div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-2"><h3 class="font-bold text-sm text-slate-800">Katalog Produk</h3></div>
          <div id="catalog-grid" class="grid grid-cols-3 gap-2 pb-4 desktop-grid-catalog">
             <div class="col-span-3 md:col-span-8 text-center text-slate-400 py-10 text-sm font-medium"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-goge-primary"></i><br>Memuat Produk...</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Login -->
    <section id="content-login" class="min-h-screen login-bg flex-col justify-center items-center p-6 fade-in hidden z-50 relative overflow-y-auto pt-10 pb-20">
      <div class="w-full max-w-sm flex flex-col items-center">
        <h1 class="text-3xl font-extrabold text-white mb-4 tracking-wide text-center">GRAVION</h1>
        <form id="form-login" onsubmit="event.preventDefault(); handleLogin();" class="w-full space-y-4">
          <input type="text" id="login-phone" placeholder="No. HP / Username" required class="w-full bg-white/95 rounded-xl px-4 py-3.5 text-sm">
          <input type="password" id="login-password" placeholder="Password" required class="w-full bg-white/95 rounded-xl px-4 py-3.5 text-sm">
          <button type="submit" id="btn-submit-login" class="w-full bg-goge-primary text-white font-bold py-3.5 rounded-xl text-sm cursor-pointer shadow-lg">MASUK</button>
        </form>
        <div class="text-center pt-4"><button type="button" onclick="switchTab('catalog')" class="text-white/80 text-xs font-bold cursor-pointer">Kembali ke Katalog</button></div>
      </div>
    </section>

    <!-- Keranjang -->
    <section id="content-cart" class="fade-in hidden bg-slate-50 min-h-screen">
      <div class="fixed top-0 left-0 right-0 max-w-[414px] mx-auto z-50 bg-goge-primary text-white p-4 flex items-center gap-3"><button onclick="switchTab('catalog')" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-bold text-lg">Keranjang Saya</h2></div>
      <div id="cart-items-container" class="pt-[88px] px-5 pb-24 space-y-4"></div>
    </section>

    <!-- Riwayat -->
    <section id="content-orders" class="fade-in hidden bg-slate-50 min-h-screen">
      <div class="fixed top-0 left-0 right-0 max-w-[414px] mx-auto z-50 bg-goge-primary text-white p-4 flex items-center gap-3"><button onclick="switchTab('profile')" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-bold text-lg">Riwayat Pesanan</h2></div>
      <div id="customer-orders-container" class="pt-[100px] px-5 pb-24 space-y-4"></div>
    </section>

    <!-- Profil -->
    <section id="content-profile" class="fade-in hidden bg-slate-50 min-h-screen">
      <div class="bg-slate-800 rounded-b-[2.5rem] pt-10 pb-10 px-5 text-center shadow-lg text-white">
        <h3 id="profile-name" class="font-bold text-xl">Pengguna</h3>
        <p id="profile-phone" class="text-sm text-slate-300">-</p>
        <span id="profile-role-badge" class="inline-block bg-white/20 text-[10px] px-3 py-1 rounded-full font-bold mt-2">CUSTOMER</span>
      </div>
      <div class="px-5 pt-6 pb-24 space-y-3">
        <button onclick="handleLogout()" class="w-full bg-red-500 text-white font-bold py-3.5 rounded-xl cursor-pointer shadow-md">KELUAR</button>
      </div>
    </section>

    <!-- Dashboard Admin -->
    <section id="content-settings" class="fade-in hidden bg-slate-50 min-h-screen">
      <div class="fixed top-0 left-0 right-0 max-w-[414px] mx-auto z-50 bg-goge-primary text-white p-4 flex items-center gap-3"><h2 class="font-bold text-lg">Dashboard Admin</h2></div>
      <div class="pt-[88px] px-5 pb-24 space-y-4">
         <div onclick="switchTab('admin-master')" class="bg-white rounded-2xl p-4 shadow-sm border flex items-center gap-4 cursor-pointer">
            <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="flex-1"><h4 class="font-bold text-slate-800 text-sm">Master Barang</h4><p class="text-[10px] text-slate-400">Kelola database produk</p></div>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
         </div>
      </div>
    </section>

    <!-- Master Barang -->
    <section id="content-admin-master" class="fade-in hidden bg-slate-50 min-h-screen">
      <div class="fixed top-0 left-0 right-0 max-w-[414px] mx-auto z-50 bg-goge-primary text-white p-4 flex items-center gap-3">
         <button onclick="switchTab('settings')" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button>
         <h2 class="font-bold text-lg">Master Barang</h2>
      </div>
      <div class="pt-[90px] px-5 pb-24 space-y-3" id="admin-master-list"></div>
    </section>

    <!-- Bottom Nav -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-[414px] mx-auto bg-white border-t border-slate-200 flex justify-around items-center pt-2 pb-3 z-40 rounded-t-2xl desktop-nav-fixed">
      <div onclick="switchTab('catalog')" id="nav-catalog" class="flex flex-col items-center gap-1 cursor-pointer w-16 text-goge-primary"><i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold">Beranda</span></div>
      <div onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center gap-1 cursor-pointer w-16 text-slate-400 relative"><i class="fa-solid fa-cart-shopping text-lg"><span id="cart-badge" class="absolute -top-1 -right-1.5 bg-red-500 text-white text-[8px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center hidden">0</span></i><span class="text-[9px] font-bold">Keranjang</span></div>
      <div onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center gap-1 cursor-pointer w-16 text-slate-400"><i class="fa-solid fa-clock-rotate-left text-lg"></i><span class="text-[9px] font-bold">Riwayat</span></div>
      <div onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 cursor-pointer w-16 text-slate-400"><i class="fa-regular fa-user text-lg"></i><span class="text-[9px] font-bold">Profil</span></div>
      <div onclick="switchTab('settings')" id="hidden-desktop-settings" class="hidden flex-col items-center gap-1 cursor-pointer w-16 text-slate-400"><i class="fa-solid fa-gear text-lg"></i><span class="text-[9px] font-bold">Admin</span></div>
    </nav>
  </div>

  <script>
    // ==========================================
    // MASUKKAN LINK /EXEC GOOGLE APPS SCRIPT ANDA DI SINI:
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx6huah4LoGGoRpjs5n2Lt9ApBIBtxhdaFLkYyU_j2MtCVxYO60LL95q9J0sZcfyw5U/exec";

    let masterData = [];
    let cartData = [];
    let currentCabangFilter = 'Semua';
    let cabangList = ["Toko Miko", "Pam Miko", "Toko Pusat", "New Store"];
    let currentUser = { phone: "", name: "Pengguna", role: "guest", address: "" }; 
    let html5QrCode = null;

    document.addEventListener('DOMContentLoaded', function() {
        let savedUser = localStorage.getItem('gravion_user');
        if (savedUser) { try { currentUser = JSON.parse(savedUser); } catch(e){} }
        updateAuthUI(); 
        renderCabangDropdowns();
        loadCartFromStorage();

        // Ambil data langsung dari Google Sheets via Fetch URL Web App
        fetch(GAS_WEB_APP_URL + "?action=getOptimizedMasterItems")
            .then(res => res.json())
            .then(res => {
                onDataLoaded(res);
            })
            .catch(err => {
                onDataLoaded({ status: "error" });
            });
    });

    function callGasApi(action, payload, callback) {
        let url = GAS_WEB_APP_URL + "?action=" + action;
        if (payload) { url += "&data=" + encodeURIComponent(JSON.stringify(payload)); }
        fetch(url)
            .then(res => res.json())
            .then(res => { if (callback) callback(res); })
            .catch(err => { if (callback) callback({ status: "error", message: err.toString() }); });
    }

    function onDataLoaded(response) {
        try {
            masterData = (response && response.status === "success" && Array.isArray(response.data)) ? response.data : [];
        } catch (e) { masterData = []; }
        filterByCabang(currentCabangFilter);
        renderAdminMasterList(masterData);
    }

    function openScannerModal() {
        document.getElementById('modal-scanner').classList.remove('hidden');
        setTimeout(() => {
            if (!html5QrCode) { html5QrCode = new Html5Qrcode("reader"); }
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, (text) => {
                closeScannerModal();
                document.getElementById('global-search').value = text;
                handleSearch();
                showCustomAlert("Berhasil Scan", `Kode: <b>${text}</b>`, "success");
            }, () => {}).catch(() => {
                showCustomAlert("Akses Ditolak", "Gagal membuka kamera.", "error");
                closeScannerModal();
            });
        }, 300);
    }

    function closeScannerModal() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => { document.getElementById('modal-scanner').classList.add('hidden'); });
        } else { document.getElementById('modal-scanner').classList.add('hidden'); }
    }

    function handleLogin() {
      const phoneInput = document.getElementById('login-phone').value.trim(); 
      const passInput = document.getElementById('login-password').value.trim();
      callGasApi("verifyLogin", { username: phoneInput, password: passInput }, function(res) {
          if(res.status === 'success') {
             currentUser = res.data;
             localStorage.setItem('gravion_user', JSON.stringify(currentUser)); 
             updateAuthUI(); switchTab('catalog'); 
             showCustomAlert('Berhasil Masuk', `Selamat datang, <b>${currentUser.name}</b>`, 'success');
          } else { showCustomAlert('Gagal Masuk', res.message, 'error'); }
      });
    }

    function handleLogout() { 
        currentUser = { phone: "", name: "Pengguna", role: "guest", address: "" }; 
        localStorage.removeItem('gravion_user'); 
        updateAuthUI(); switchTab('catalog'); 
    }

    function updateAuthUI() {
        const topText = document.getElementById('top-auth-text'); 
        const desktopSettings = document.getElementById('hidden-desktop-settings');
        if (currentUser.role === 'guest') { 
            if(topText) topText.innerText = "Masuk / Daftar"; 
            if(desktopSettings) desktopSettings.classList.add('hidden');
        } else { 
            if(topText) topText.innerText = currentUser.name || currentUser.phone; 
            if(desktopSettings) { 
                if (currentUser.role === 'owner' || currentUser.role === 'admin') { 
                    desktopSettings.classList.remove('hidden'); desktopSettings.classList.add('flex'); 
                } else { desktopSettings.classList.add('hidden'); } 
            }
        }
        document.getElementById('profile-name').innerText = currentUser.name || "Pengguna";
        document.getElementById('profile-phone').innerText = currentUser.phone || "-";
        document.getElementById('profile-role-badge').innerText = (currentUser.role || 'guest').toUpperCase();
    }

    function filterByCabang(cabang) { currentCabangFilter = cabang; renderCabangDropdowns(); applyFilters(); }
    
    function applyFilters() {
      const query = document.getElementById('global-search').value.toLowerCase();
      let filtered = masterData.filter(item => {
        let matchCabang = (currentCabangFilter === 'Semua') || (String(item.cabang).toLowerCase() === currentCabangFilter.toLowerCase());
        let matchQuery = !query || String(item.namaBarang).toLowerCase().includes(query) || String(item.idBarang).toLowerCase().includes(query);
        return matchCabang && matchQuery;
      });
      renderCatalog(filtered);
    }

    function handleSearch() { applyFilters(); }
    function clearSearchInput() { document.getElementById('global-search').value = ''; applyFilters(); }

    function renderCatalog(items) {
      const grid = document.getElementById('catalog-grid'); if (!grid) return; grid.innerHTML = ''; 
      if (!items || items.length === 0) { grid.innerHTML = '<p class="col-span-3 md:col-span-8 text-center text-slate-400 text-sm py-10">Tidak ada buku ditemukan di Google Sheets.</p>'; return; }
      items.forEach((item) => {
        let imgUrl = item.image ? item.image : 'https://placehold.co/150x200?text=No+Cover'; 
        grid.insertAdjacentHTML('beforeend', `
          <div class="bg-white rounded-xl p-1.5 shadow-sm border border-slate-100 flex flex-col justify-between">
            <div>
              <div class="aspect-[3/4] bg-slate-50 rounded-lg mb-1 overflow-hidden relative"><img src="${imgUrl}" class="w-full h-full object-cover"></div>
              <h4 class="font-bold text-[9px] text-slate-800 line-clamp-2">${item.namaBarang}</h4>
              <p class="text-[8px] text-slate-400">${item.cabang} | Stok: ${item.stok}</p>
            </div>
            <div class="flex items-center justify-between pt-1.5"><span class="font-extrabold text-[9px] text-slate-800">Rp ${Number(item.harga || 0).toLocaleString('id-ID')}</span></div>
          </div>
        `);
      });
    }

    function renderCabangDropdowns() {
        const filterContainer = document.getElementById('cabang-filter-container');
        if(!filterContainer) return;
        let html = `<div onclick="filterByCabang('Semua')" class="cursor-pointer shrink-0 text-center"><div class="w-10 h-10 rounded-xl flex items-center justify-center ${currentCabangFilter === 'Semua' ? 'bg-goge-primary text-white' : 'bg-white text-goge-primary'}"><i class="fa-solid fa-layer-group text-xs"></i></div><span class="text-[9px]">Semua</span></div>`;
        cabangList.forEach(c => {
            html += `<div onclick="filterByCabang('${c}')" class="cursor-pointer shrink-0 text-center"><div class="w-10 h-10 rounded-xl flex items-center justify-center ${currentCabangFilter === c ? 'bg-goge-primary text-white' : 'bg-white text-goge-primary'}"><i class="fa-solid fa-store text-xs"></i></div><span class="text-[9px] truncate max-w-[50px]">${c}</span></div>`;
        });
        filterContainer.innerHTML = html;
    }

    function renderAdminMasterList(items) {
        const list = document.getElementById('admin-master-list'); if(!list) return; list.innerHTML = '';
        if(items.length === 0) { list.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">Belum ada data barang.</p>'; return; }
        items.forEach(item => {
            list.insertAdjacentHTML('beforeend', `<div class="bg-white p-3 rounded-xl shadow-sm border"><h4 class="font-bold text-sm">${item.namaBarang}</h4><p class="text-xs text-slate-500">Cabang: ${item.cabang} | Stok: ${item.stok} | Rp ${Number(item.harga).toLocaleString('id-ID')}</p></div>`);
        });
    }

    function showCustomAlert(title, message, type = 'info') {
        const modal = document.getElementById('custom-alert'); 
        const content = document.getElementById('custom-alert-content');
        document.getElementById('custom-alert-title').innerText = title; 
        document.getElementById('custom-alert-message').innerHTML = message;
        modal.classList.remove('hidden');
        setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
    }
    function closeCustomAlert() { document.getElementById('custom-alert').classList.add('hidden'); }
    function loadCartFromStorage() {}

    function switchTab(tabId) {
      if (currentUser.role === 'guest' && ['cart', 'orders', 'profile', 'settings'].includes(tabId)) { 
          showCustomAlert('Akses Terbatas', 'Silakan Masuk terlebih dahulu.', 'warning'); 
          tabId = 'login'; 
      }
      const sections = ['content-login', 'content-catalog', 'content-cart', 'content-orders', 'content-profile', 'content-settings', 'content-admin-master'];
      sections.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); });

      const target = document.getElementById('content-' + tabId);
      if (target) {
          target.classList.remove('hidden');
          if (tabId === 'login') target.classList.add('flex'); else target.classList.add('block');
      }
      document.getElementById('bottom-nav').classList.toggle('hidden', tabId === 'login');
    }
  </script>
</body>
</html>
